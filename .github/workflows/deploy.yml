name: publicar portafolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: summoners-rift-portfolio

    steps:
      - name: descargar repositorio
        uses: actions/checkout@v4

      - name: configurar node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: summoners-rift-portfolio/package-lock.json

      - name: instalar dependencias
        run: npm ci

      - name: generar pagina
        run: npm run build

      - name: configurar github pages
        uses: actions/configure-pages@v5

      - name: subir archivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: summoners-rift-portfolio/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: publicar pagina
        id: deployment
        uses: actions/deploy-pages@v4
